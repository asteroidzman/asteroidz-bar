<?xml version='1.0' encoding='UTF-8'?>
<!-- A clipboard: the clipboard module's pill.

     Solid white, filled paths, no strokes: the bar tints icons with a
     ColorOverlay, which paints through the alpha channel and discards the
     source colour, so coverage is all that survives. A stroked outline would
     tint the strokes and the gaps between them alike and read as a blob at
     pill size.

     The board is a RING (evenodd) rather than a filled slab, for the same
     reason the alarm clock's face is: a solid rectangle at 24px is a
     rectangle, and the thing that makes this a clipboard rather than a note
     is the clip breaking its top edge.

     Two rules inside, not four. Enough to say "something written on it" and
     few enough that they stay separate lines instead of merging into grey at
     the size this is actually drawn.

     No double hyphen anywhere in here. It is not legal inside an XML comment
     and rsvg refuses the whole file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- the board, as a ring -->
  <path fill="#ffffff" fill-rule="evenodd"
        d="M6.5 4.4h11a2.2 2.2 0 0 1 2.2 2.2v13.1a2.2 2.2 0 0 1-2.2 2.2h-11a2.2 2.2 0 0 1-2.2-2.2V6.6a2.2 2.2 0 0 1 2.2-2.2zm0 1.9a.3.3 0 0 0-.3.3v13.1a.3.3 0 0 0 .3.3h11a.3.3 0 0 0 .3-.3V6.6a.3.3 0 0 0-.3-.3z"/>

  <!-- the clip, breaking the top edge -->
  <path fill="#ffffff"
        d="M9.6 2.1h4.8a1.5 1.5 0 0 1 1.5 1.5v2.6a1.5 1.5 0 0 1-1.5 1.5H9.6a1.5 1.5 0 0 1-1.5-1.5V3.6a1.5 1.5 0 0 1 1.5-1.5z"/>

  <!-- what is written on it -->
  <path fill="#ffffff" d="M8.1 11.6h7.8v1.7H8.1z"/>
  <path fill="#ffffff" d="M8.1 15.4h5.4v1.7H8.1z"/>
</svg>
